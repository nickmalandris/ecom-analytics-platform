[project]
name = "shopify-meta-analytics"
version = "0.1.0"
description = "Multi-tenant analytics platform for Shopify and Meta Ads data with LLM-powered weekly reports"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.0",
    "pydantic-settings>=2.0.0",
    "pydantic-ai>=0.0.30",
    "alembic>=1.13.0",
    "apscheduler>=3.10.0",
    "jinja2>=3.1.0",
    "aiosmtplib>=3.0.0",
    "pandas>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "slowapi>=0.1.9",
    "sentry-sdk[fastapi]>=2.0.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "faker>=30.0.0",
    "numpy>=1.26.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
dev-dependencies = [
    "faker>=30.0.0",
    "numpy>=1.26.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
